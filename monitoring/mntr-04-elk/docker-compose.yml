## docker-compose.yml ##

version: '3'

volumes:
  elastic_data_warm: {}
  elastic_data_hot: {}

services:

  elasticsearch-hot:
    container_name: elasticsearch-hot
    hostname: elasticsearch-hot
    image: elasticsearch:8.11.3
    environment:
      discovery.seed_hosts: elasticsearch-hot,elasticsearch-warm
      cluster.initial_master_nodes: elastic-hot,elastic-warm
      node.roles: master,data_content,data_hot
      ES_JAVA_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - elastic_data_hot:/usr/share/elasticsearch/data
      - ./elasticsearch/hot/hot.yml:/usr/share/elasticsearch/config/elasticsearch.yml:rw
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elkstacknet
    depends_on:
      - elasticsearch-warm

  elasticsearch-warm:
    container_name: elasticsearch-warm
    hostname: elasticsearch-warm
    image: elasticsearch:8.11.3
    environment:
      discovery.seed_hosts: elasticsearch-hot,elasticsearch-warm
      cluster.initial_master_nodes: elastic-hot,elastic-warm
      node.roles: master,data_warm
      ES_JAVA_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - elastic_data_warm:/usr/share/elasticsearch/data
      - ./elasticsearch/warm/warm.yml:/usr/share/elasticsearch/config/elasticsearch.yml:rw
    networks:
      - elkstacknet

  kibana:
    container_name: kibana
    image: kibana:8.11.3
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-hot
    networks:
      - elkstacknet

  logstash:
    container_name: logstash
    hostname: logstash
    image: logstash:8.11.3
    volumes:
      - ./logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash.conf:/usr/share/logstash/config/logstash.conf
    command: logstash -f /usr/share/logstash/config/logstash.conf
    ports:
      - "5044:5044"
      - "9600:9600"
      # - "7777:7777"
    networks:
      - elkstacknet

  filebeat:
    image: elastic/filebeat:8.11.3
    user: root
    privileged: true
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:Z
      - /var/lib/docker:/var/lib/docker:Z
      - /var/run/docker.sock:/var/run/docker.sock:Z
    depends_on:
      - logstash
    networks:
      - elkstacknet
  
  some_application:
    image: library/python:3.9-alpine
    container_name: localapp
    volumes:
      - ./pinger/:/opt/:Z
    entrypoint: python3 /opt/run.py
    networks:
      - elkstacknet

networks:
  elkstacknet:
    driver: bridge
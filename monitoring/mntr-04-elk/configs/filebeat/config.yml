filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    multiline.pattern: '^\d{4}-\d{2}-\d{2}'  # если нужны multiline
    multiline.negate: true
    multiline.match: after

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  - decode_json_fields:
      fields: ["message"]
      target: "json"
      overwrite_keys: true

output.logstash:
  hosts: ["logstash:5046"]
  protocol: tcp
  
logging.json: true
logging.metrics.enabled: false
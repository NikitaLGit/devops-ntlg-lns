apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxtool
  namespace: netology
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginxtool
  template:
    metadata:
      labels:
        app: nginxtool
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - containerPort: 80

      - name: multitool
        image: wbitt/network-multitool
        ports:
        - containerPort: 8080
        env: 
          - name: HTTP_PORT
            value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: nginxtool-svc
  namespace: netology
spec:
  selector: 
    app: nginxtool
  ports:
    - name: nginxhttp
      protocol: TCP
      port: 9001
      targetPort: 80
    - name: miltitool
      protocol: TCP
      port: 9002
      targetPort: 8080

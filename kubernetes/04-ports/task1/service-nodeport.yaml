apiVersion: v1
kind: Service
metadata:
  name: nginxtool-nodeport
  namespace: netology
spec:
  type: NodePort
  selector: 
    app: nginxtool
  ports:
    - name: nginx
      port: 80
      targetPort: 80
      nodePort: 30001
    - name: multitool
      port: 8080
      targetPort: 8080
      nodePort: 30002
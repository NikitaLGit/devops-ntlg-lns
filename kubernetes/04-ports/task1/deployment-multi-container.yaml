apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxtool
  namespace: netology
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginxtool
  template:
    metadata:
      labels:
        app: nginxtool
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - containerPort: 80

      - name: multitool
        image: wbitt/network-multitool
        ports:
        - containerPort: 8080
        env: 
          - name: HTTP_PORT
            value: "8080"
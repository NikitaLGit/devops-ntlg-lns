apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxtool1
  namespace: netology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxtool1
  template:
    metadata:
      labels:
        app: nginxtool1
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - containerPort: 80

      - name: multitool
        image: wbitt/network-multitool
        ports:
        - containerPort: 1180
        env: 
          - name: HTTP_PORT
            value: "1180"
---
apiVersion: v1
kind: Pod
metadata:
   name: multitool1
   namespace: netology
spec:
   containers:
     - name: multitool1
       image: wbitt/network-multitool
       ports:
        - containerPort: 1180
---
apiVersion: v1
kind: Service
metadata:
  name: nginxtool1-svc
  namespace: netology
spec:
  selector: 
    app: nginxtool1
  ports:
    - name: nginxhttp
      protocol: TCP
      port: 8081
      targetPort: 80
    - name: miltitool
      protocol: TCP
      port: 8082
      targetPort: 1180


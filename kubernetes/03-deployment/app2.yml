apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxtool2
  namespace: netology
spec:
  selector:
    matchLabels:
      app: nginxtool2
  replicas: 1
  template:
    metadata:
      labels:
        app: nginxtool2
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - containerPort: 80
      initContainers:
      - name: delay
        image: busybox
        command: ['sh', '-c', "until nslookup nginxtool2-svc.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for nginxtool2-svc; sleep 2; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginxtool2-svc
  namespace: netology
spec:
  ports:
    - name: nginxtool2
      port: 80
  selector:
    app: nginxtool2